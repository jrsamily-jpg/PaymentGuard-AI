services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paymentguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: paymentguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentguard -d paymentguard"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: .
    environment: &environment
      WORKSPACE_DATABASE_URL: postgresql+psycopg://paymentguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/paymentguard
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  dashboard:
    build: .
    command: ["python", "-m", "streamlit", "run", "app/dashboard/main.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment: *environment
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
